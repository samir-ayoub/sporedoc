<?xml version="1.0" encoding="UTF-8"?>
<!--
  SporeDoc — master logo (full fidelity).
  108 x 108 grid = Android adaptive-icon canvas (1 unit = 1 dp).
  Safe zone: circle r=33 centred at 54,54. All of the pyramid lives inside it.
  Uses SVG filters (grain, brushed metal, glow): use this file for the Play Store
  512 px PNG, marketing and previews. Android VectorDrawable cannot import filters;
  use the files under /android for the app.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 108 108">
  <defs>
    <radialGradient id="bg" cx="54" cy="50" r="78" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2E1446"/>
      <stop offset="0.38" stop-color="#160A26"/>
      <stop offset="0.72" stop-color="#060309"/>
      <stop offset="1" stop-color="#030305"/>
    </radialGradient>
    <radialGradient id="haze" cx="54" cy="54" r="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5A2483" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#5A2483" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="faceL" x1="38" y1="40" x2="54" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E6C574"/>
      <stop offset="0.45" stop-color="#CFA53A"/>
      <stop offset="1" stop-color="#94702A"/>
    </linearGradient>
    <linearGradient id="faceR" x1="70" y1="40" x2="54" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D9B65A"/>
      <stop offset="0.5" stop-color="#B38B33"/>
      <stop offset="1" stop-color="#76571C"/>
    </linearGradient>

    <linearGradient id="beamGlow" x1="51" y1="0" x2="57" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#39FF14" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#39FF14" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#39FF14" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="54" cy="33" r="7" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C8FFB8" stop-opacity="0.75"/>
      <stop offset="0.3" stop-color="#39FF14" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#39FF14" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="pyramid">
      <path d="M54 33 31 62 54 75 77 62Z"/>
    </clipPath>

    <filter id="grain" x="0" y="0" width="108" height="108" filterUnits="userSpaceOnUse">
      <feTurbulence type="fractalNoise" baseFrequency="8" numOctaves="2" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 0 1"/>
    </filter>
    <filter id="brushed" x="0" y="0" width="108" height="108" filterUnits="userSpaceOnUse">
      <feTurbulence type="fractalNoise" baseFrequency="0.12 5" numOctaves="2" seed="3"/>
      <feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 0 1"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.9"/>
    </filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
  </defs>

  <!-- Background: nebula to abyss -->
  <rect width="108" height="108" fill="url(#bg)"/>
  <rect width="108" height="108" fill="url(#haze)"/>

  <!-- Pyramid shadow sinking into the abyss -->
  <path d="M54 37 33 64 54 79 75 64Z" fill="#000000" opacity="0.65" filter="url(#shadow)"/>

  <!-- Pyramid faces: matte gold / brushed brass -->
  <path d="M54 33 31 62 54 75Z" fill="url(#faceL)"/>
  <path d="M54 33 77 62 54 75Z" fill="url(#faceR)"/>
  <!-- Brushed streaks, rotated to run down the faces -->
  <g clip-path="url(#pyramid)">
    <rect x="-20" y="-20" width="148" height="148" filter="url(#brushed)" opacity="0.16" style="mix-blend-mode:overlay" transform="rotate(-38 54 54)"/>
  </g>
  <!-- Sharp metallic edges -->
  <path d="M31 62 54 33 77 62" fill="none" stroke="#FFF0C4" stroke-opacity="0.55" stroke-width="0.28" stroke-linejoin="miter"/>
  <path d="M31 62 54 75 77 62" fill="none" stroke="#5E4416" stroke-opacity="0.6" stroke-width="0.28" stroke-linejoin="miter"/>

  <!-- Laser beam: glow, core, hot centre -->
  <rect x="51" y="0" width="6" height="108" fill="url(#beamGlow)"/>
  <rect x="53.55" y="0" width="0.9" height="108" fill="#39FF14" filter="url(#soft)" opacity="0.9"/>
  <rect x="53.6" y="0" width="0.8" height="108" fill="#39FF14"/>
  <rect x="53.85" y="0" width="0.3" height="108" fill="#E9FFE2" opacity="0.85"/>

  <!-- Apex halo -->
  <circle cx="54" cy="33" r="7" fill="url(#halo)"/>
  <circle cx="54" cy="33" r="3.4" fill="none" stroke="#39FF14" stroke-opacity="0.45" stroke-width="0.22"/>

  <!-- Analog grain over everything (8%) -->
  <rect width="108" height="108" filter="url(#grain)" opacity="0.08"/>
</svg>
